<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - CashLoan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f7f6; color: #333; padding: 20px; }
    
    /* Header */
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .admin-header h1 { color: #1e293b; font-size: 22px; display: flex; align-items: center; gap: 10px; }
    .admin-header h1 i { color: #16a34a; }
    .badge { background: #dcfce7; color: #16a34a; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 12px 20px; background: white; color: #64748b; border: 1px solid #e2e8f0; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: #16a34a; color: white; border-color: #16a34a; box-shadow: 0 4px 10px rgba(22,163,74,0.2); }

    /* Table Container */
    .table-container { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: none; }
    .table-container.active { display: block; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; color: #64748b; font-size: 13px; font-weight: 600; text-transform: uppercase; padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    
    /* Badges */
    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .status-PENDING { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
    .status-APPROVED { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    
    /* Buttons */
    .btn-approve { background: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.3s; font-size: 13px; }
    .btn-approve:hover { background: #15803d; transform: translateY(-2px); }
    .btn-doc { display: inline-block; padding: 5px 10px; background: #eff6ff; color: #2563eb; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; margin-right: 4px; border: 1px solid #bfdbfe; }

    /* Empty State */
    .empty-state { text-align: center; padding: 50px; color: #94a3b8; }
    .empty-state i { font-size: 50px; margin-bottom: 15px; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="admin-header">
    <h1><i class="fa-solid fa-shield-halved"></i> CashLoan Admin</h1>
    <span class="badge">Live System</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('loanTab')"><i class="fa-solid fa-hand-holding-dollar"></i> Loan Requests</button>
    <button class="tab-btn" onclick="showTab('withdrawTab')"><i class="fa-solid fa-money-bill-transfer"></i> Withdraw Requests</button>
  </div>

  <!-- Loan Requests Table -->
  <div id="loanTab" class="table-container active">
    <table>
      <thead>
        <tr>
          <th>User Name</th>
          <th>Loan Amount</th>
          <th>Deposit (10%)</th>
          <th>TrxID</th>
          <th>KYC Docs</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="loanTableBody"></tbody>
    </table>
  </div>

  <!-- Withdraw Requests Table -->
  <div id="withdrawTab" class="table-container">
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Amount</th>
          <th>Method</th>
          <th>Account</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="withdrawTableBody"></tbody>
    </table>
  </div>

  <script>
    function showTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.table-container').forEach(c => c.classList.remove('active'));
      
      document.querySelector(`.tab-btn[onclick="showTab('${tabId}')"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    async function loadLoans() {
      try {
        const res = await fetch('/api/admin/loans');
        const loans = await res.json();
        const tbody = document.getElementById('loanTableBody');

        if (loans.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="fa-solid fa-inbox"></i><h3>No loan applications yet</h3></div></td></tr>`;
          return;
        }

        tbody.innerHTML = loans.reverse().map(l => `
          <tr>
            <td>
              <div style="font-weight:600; color:#1e293b;">${l.fullName || 'N/A'}</div>
              <div style="font-size:12px; color:#64748b;">NID: ${l.nidNumber || 'N/A'}</div>
            </td>
            <td style="font-weight: 700; color: #0f172a;">৳${l.amount}</td>
            <td style="color: #ea580c; font-weight: 600;">৳${l.fee}</td>
            <td style="color: #2563eb; font-weight: 600;">${l.trxid}</td>
            <td>
              ${l.nidFrontPhoto ? `<a href="/${l.nidFrontPhoto}" target="_blank" class="btn-doc"><i class="fa-solid fa-id-card"></i> NID</a>` : ''}
              ${l.selfiePhoto ? `<a href="/${l.selfiePhoto}" target="_blank" class="btn-doc"><i class="fa-solid fa-camera"></i> Selfie</a>` : ''}
            </td>
            <td><span class="status-badge status-${l.status}">${l.status}</span></td>
            <td>
              ${l.status === 'PENDING' ? 
                `<button class="btn-approve" onclick="approveLoan('${l.id}')"><i class="fa-solid fa-check"></i> Approve</button>` : 
                `<span style="color: #16a34a; font-weight: 600; font-size: 13px;"><i class="fa-solid fa-circle-check"></i> Done</span>`
              }
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error loading loans:', err);
      }
    }

    async function loadWithdrawals() {
      try {
        const res = await fetch('/api/admin/withdrawals');
        const withdrawals = await res.json();
        const tbody = document.getElementById('withdrawTableBody');

        if (withdrawals.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-inbox"></i><h3>No withdrawal requests yet</h3></div></td></tr>`;
          return;
        }

        tbody.innerHTML = withdrawals.reverse().map(w => `
          <tr>
            <td style="font-weight:600; color:#1e293b;">${w.userId}</td>
            <td style="font-weight:700; color:#0f172a;">৳${w.amount}</td>
            <td style="font-weight:600; color:#2563eb;">${w.method.toUpperCase()}</td>
            <td>${w.account}</td>
            <td><span class="status-badge status-${w.status}">${w.status}</span></td>
            <td>
              ${w.status === 'PENDING' ? 
                `<button class="btn-approve" onclick="approveWithdraw('${w.id}')"><i class="fa-solid fa-check"></i> Approve</button>` : 
                `<span style="color: #16a34a; font-weight: 600; font-size: 13px;"><i class="fa-solid fa-circle-check"></i> Done</span>`
              }
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error loading withdrawals:', err);
      }
    }

    async function approveLoan(loanId) {
      if (!confirm('Are you sure you want to approve this loan? Make sure you have verified the TrxID.')) return;
      try {
        const res = await fetch('/api/admin/approve', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loanId })
        });
        const data = await res.json();
        if (data.success) { alert('✅ Loan Approved!'); loadLoans(); } 
        else { alert('❌ Failed to approve loan.'); }
      } catch (err) { alert('❌ Server error.'); }
    }

    async function approveWithdraw(withdrawId) {
      if (!confirm('Are you sure you want to approve this withdrawal?')) return;
      try {
        const res = await fetch('/api/admin/approve-withdrawal', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ withdrawId })
        });
        const data = await res.json();
        if (data.success) { alert('✅ Withdrawal Approved!'); loadWithdrawals(); } 
        else { alert('❌ Failed to approve withdrawal.'); }
      } catch (err) { alert('❌ Server error.'); }
    }

    // Load initially and every 5 seconds
    loadLoans();
    loadWithdrawals();
    setInterval(() => { loadLoans(); loadWithdrawals(); }, 5000);
  </script>
</body>
</html>
